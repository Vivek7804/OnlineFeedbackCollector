{% extends "layout.html" %}
{% block title %}Share Feedback | Feedback Hub{% endblock %}
{% block content %}
<section class="hero rounded-4 p-4 p-md-5 mb-4">
  <span class="badge text-bg-primary mb-3">Your voice matters</span>
  <h1 class="display-5 fw-bold">Help us do better.</h1>
  <p class="lead text-secondary mb-0">Share a quick review. Your feedback helps us improve the experience.</p>
</section>
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm rounded-4"><div class="card-body p-4 p-md-5">
      <h2 class="h4 mb-4">Feedback form</h2>
      <form method="POST" action="{{ url_for('submit_feedback') }}" id="feedbackForm">
        <div class="row g-3">
          <div class="col-md-6"><label for="name" class="form-label">Name</label><input class="form-control" id="name" name="name" maxlength="100" required></div>
          <div class="col-md-6"><label for="email" class="form-label">Email</label><input class="form-control" id="email" name="email" type="email" maxlength="254" required></div>
          <div class="col-12"><label class="form-label d-block">Your rating</label>
            <div class="rating-picker" role="radiogroup" aria-label="Rating from 1 to 5">
              {% for value in range(1, 6) %}<label><input type="radio" name="rating" value="{{ value }}" required><span>{{ value }} ★</span></label>{% endfor %}
            </div>
          </div>
          <div class="col-12"><label for="comments" class="form-label">Comments</label><textarea class="form-control" id="comments" name="comments" rows="4" maxlength="2000" placeholder="What went well? What could be improved?" required></textarea></div>
          <div class="col-12 d-grid d-sm-flex justify-content-sm-end"><button class="btn btn-primary btn-lg px-4" type="submit">Submit feedback →</button></div>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
